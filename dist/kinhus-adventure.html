}

/* ---------------- chefe: MEGA BUG ---------------- */
function makeBoss(px, bottom) {
  return { kind: 'boss', x: px - 10, y: bottom - 30, w: 36, h: 30, vx: 0, vy: 0, hp: 12, maxHp: 12, state: 'sleep', t: 0, dir: -1, inv: 0, phase: 1, step: 0, onGround: true };
}
function updateBoss(b, p) {
  b.t++;
  if (b.inv > 0) b.inv--;
  const pdx = p.x + p.w / 2 - (b.x + b.w / 2);
  const grav = () => { b.vy = Math.min(b.vy + 0.32, 7); moveBody(b); };
  switch (b.state) {
    case 'sleep': b.vx = 0; break;
    case 'intro': grav(); if (b.t === 30) { shake(10); Sound.fx('bosshit'); } if (b.t > 100) { b.state = 'walk'; b.t = 0; } break;
    case 'walk':
      if (b.t % 40 === 1) b.dir = U.sign(pdx) || b.dir;
      b.vx = b.dir * (b.phase === 2 ? 1.1 : 0.6); grav();
      if (b.t > (b.phase === 2 ? 70 : 100)) {
        const seq = b.phase === 2 ? ['jump', 'spit', 'summon', 'jump', 'spit'] : ['jump', 'spit', 'jump', 'spit'];
        b.state = seq[b.step++ % seq.length]; b.t = 0; b.vx = 0;
      }
      break;
    case 'jump':
      if (b.t < 18) { b.vx = 0; grav(); break; }
      if (b.t === 18) { b.vy = -7.6; b.vx = U.clamp(pdx / 48, -2.6, 2.6); b.onGround = false; }
      { const was = b.onGround; grav(); if (b.onGround && b.t > 20 && !was) {
        shake(12); Sound.fx('thud'); dust(b.x + 6, b.y + b.h, 5); dust(b.x + b.w - 6, b.y + b.h, 5);
        for (const d of [-1, 1]) World.projs.push({ type: 'wave', x: b.x + b.w / 2 - 5 + d * 14, y: b.y + b.h - 10, w: 10, h: 10, vx: d * (b.phase === 2 ? 2.6 : 2.1), vy: 0, life: 200, hostile: true, t: 0 });
        b.state = 'walk'; b.t = 0; b.vx = 0;
      } }
      break;
    case 'spit':
      b.vx = 0; grav();
      if (b.t === 30) {
        const n = b.phase === 2 ? 3 : 1;
        for (let i = 0; i < n; i++) {
          const ang = Math.atan2(p.y + 8 - (b.y + 18), pdx) + (i - (n - 1) / 2) * 0.35;
          World.projs.push({ type: 'glitch', x: b.x + b.w / 2 - 5, y: b.y + 14, w: 10, h: 10, vx: Math.cos(ang) * 2.1, vy: Math.sin(ang) * 2.1, life: 240, hostile: true, t: 0 });
        }
        Sound.fx('zap');
      }
      if (b.t > 56) { b.state = 'walk'; b.t = 0; }
      break;
    case 'summon':
      b.vx = 0; grav();
      if (b.t === 24 && World.ents.filter(e => e.type === 'bug' && e.alive && !e.dying).length < 3) {
        for (const d of [-1, 1]) { const e = addEnt(makeEnemy('u', b.x + b.w / 2 - 8, b.y + b.h)); e.dir = d; e.vy = -3; e.x += d * 12; }
        Sound.fx('appear');
      }
      if (b.t > 50) { b.state = 'walk'; b.t = 0; }
      break;
    case 'hurt':
      grav(); b.vx *= 0.9;
      if (b.t > 40) { b.state = 'walk'; b.t = 0; }
      break;
    case 'dead':
      b.vx = 0;
      if (b.t % 6 === 0 && b.t < 120) { sparkle(b.x + Math.random() * b.w, b.y + Math.random() * b.h, 6, ['#ff4080', '#40f0ff', '#ffffff'][b.t % 3]); shake(4); }
      if (b.t >= 120) { b.vy += 0.3; b.y += b.vy; }
      if (b.t === 140) {
        addEnt({ kind: 'item', item: 'trophy', x: World.arena.x + 120, y: 20, w: 12, h: 12, vx: 0, vy: 0, emerge: 0, dir: 1 });
        popup(World.arena.x + 92, 60, 'BUG CORRIGIDO!', '#80ff80');
      }
      if (b.y > World.h * TS + 40) b.alive = false;
      return;
  }
  if (b.state === 'sleep' || p.dead || World.clear) return;
  // colisão com o Kinhu
  if (U.overlap(b, p)) {
    const fromAbove = p.vy > 0 && p.prevY + p.h <= b.y + 10;
    if (fromAbove || p.wild > 0) {
      p.vy = -7.2; p.y = b.y - p.h;
      hitBoss(b, p.wild > 0 ? 2 : 4);
    } else if (b.state !== 'dead') { hurtPlayer(); if (!p.dead) p.vx = U.sign(p.x - b.x) * 3; }
  }
}
function hitBoss(b, dmg) {
  if (b.inv > 0 || b.state === 'dead') return;
  b.hp -= dmg; b.inv = dmg >= 4 ? 70 : 12;
  Sound.fx('bosshit'); shake(dmg >= 4 ? 8 : 3);
  addScore(dmg >= 4 ? 1000 : 200, b.x + 8, b.y - 6);
  if (b.hp <= 6 && b.phase === 1) { b.phase = 2; World.banner = 'ELE FICOU BRAVO!'; World.bannerT = 90; }
  if (b.hp <= 0) {
    b.state = 'dead'; b.t = 0; b.vy = -2;
    Sound.stop(); Sound.fx('bossdie');
    addScore(10000, b.x, b.y - 10);
    World.projs = World.projs.filter(q => !q.hostile);
    for (const e of World.ents) if (e.enemy && !e.dying) killEnemy(e, 'bean');
  } else if (dmg >= 4) { b.state = 'hurt'; b.t = 0; b.vy = -2; }
}

/* ---------------- chegada (fim de fase) ---------------- */
function startClear() {
  const p = World.player;
  World.clear = { phase: 'walk', t: 0, kind: World.goal.kind };
  p.control = false; p.inv = 0;
  Sound.stop();
  if (World.clear.kind === 'busstop') {
    World.clear.phase = 'wait';
    World.clear.bus = { x: World.cam.x + W + 20, y: World.goal.y - 62, vx: -4 };
    Sound.fx('honk');
  } else Sound.play('clear');
  App.saveProgress(true);
}
function updateClear() {
  const c = World.clear, p = World.player;
  c.t++;
  const doorX = World.goal ? World.goal.x + (c.kind === 'building' ? 24 : c.kind === 'elevator' ? 16 : c.kind === 'busdoor' ? 8 : 0) : 0;
  const gravity = () => { p.vy = Math.min(p.vy + 0.55, 6); p.prevY = p.y; moveBody(p); landOnPlats(p); };
  switch (c.phase) {
    case 'wait': {
      p.vx *= 0.8; gravity();
      const bus = c.bus;
      const stopX = World.goal.x - 22;
      bus.x += bus.vx;
      if (bus.x < stopX + 60) bus.vx = Math.min(-0.4, bus.vx * 0.94);
      if (bus.x <= stopX) { bus.x = stopX; bus.vx = 0; c.phase = 'board'; c.t = 0; Sound.fx('door'); Sound.play('clear'); }
      break;
    }
    case 'board': {
      const target = c.bus.x + 14;
      const dx = target - (p.x + p.w / 2);
      p.facing = U.sign(dx) || -1;
      p.vx = Math.abs(dx) > 2 ? U.sign(dx) * 1.2 : 0; gravity();
      p.anim += 0.12;
      if (Math.abs(dx) <= 2 && c.t > 20) { p.hidden = true; c.phase = 'leave'; c.t = 0; Sound.fx('door'); }
      break;
    }
    case 'leave':
      if (c.t > 30) { c.bus.vx = Math.max(-4, c.bus.vx - 0.08); c.bus.x += c.bus.vx; }
      if (c.t > 60) { c.phase = 'tally'; c.t = 0; }
      break;
    case 'walk': {
      const dx = doorX - (p.x + p.w / 2);
      p.facing = U.sign(dx) || 1;
      p.vx = Math.abs(dx) > 2 ? U.sign(dx) * 1.2 : 0; gravity();
      p.anim += 0.12;
      if (Math.abs(dx) <= 2) { c.phase = 'enter'; c.t = 0; Sound.fx('door'); }
      break;
    }
    case 'enter':
      p.vx = 0; p.win = true;
      if (c.t > 40) { p.hidden = true; c.phase = 'tally'; c.t = 0; }
      break;
    case 'tally':
      if (World.time > 0) {
        const n = Math.min(World.time, 3);
        World.time -= n; Game.score += n * 50;
        if (c.t % 3 === 0) Sound.fx('tick');
      } else if (c.t > 60 && !Sound.isPlaying()) App.levelDone();
      else if (c.t > 240) App.levelDone();
      break;
  }
}

/* ---------------- atualização geral ---------------- */
function updateWorld() {
  const Wd = World, p = Wd.player;
  Wd.t++;
  Wd.busX = (Wd.busX || 0) + Wd.busSpeed;
  updatePlats();
  if (Wd.clear) updateClear();
  else updatePlayer(p);
  for (const e of Wd.ents) {
    if (!e.alive) continue;
    const far = e.x > Wd.cam.x + W + 64 || e.x + (e.w || 16) < Wd.cam.x - 96;
    if (far && e.kind !== 'lane' && e.kind !== 'car' && e.kind !== 'boss' && !e.dying && e.kind !== 'popcoin') continue;
    updateEnt(e);
  }
  playerVsEnemies();
  updateProjs();
  Wd.ents = Wd.ents.filter(e => e.alive);
  Wd.plats = Wd.plats.filter(pl => pl.alive || pl.kind === 'fall');
  for (const q of Wd.parts) { q.t++; q.vy += q.g || 0; q.x += q.vx; q.y += q.vy; }
  Wd.parts = Wd.parts.filter(q => q.t < q.life);
  for (const b of Wd.bumps) b.t++;
  Wd.bumps = Wd.bumps.filter(b => b.t < 10);
  if (Wd.bannerT > 0) Wd.bannerT--;
  // chegada
  if (!Wd.clear && !p.dead && Wd.goal && p.x + p.w / 2 >= Wd.goal.x + (Wd.goal.kind === 'busstop' ? 4 : 0)) startClear();
  // arena do chefe
  if (Wd.arena && !Wd.arena.active && p.x > Wd.arena.x + 20 && !p.dead) {
    Wd.arena.active = true; Wd.cam.lock = Wd.arena.x; Wd.bossFight = true;
    for (let ty = 2; ty < 12; ty++) setTile(Wd.arena.tx - 1, ty, 'S');
    Wd.boss.state = 'intro'; Wd.boss.t = 0;
    Wd.banner = 'MEGA BUG!'; Wd.bannerT = 120;
    Sound.play('boss', true);
  }
  // tempo
  if (!Wd.clear && !p.dead) {
    if (++Wd.timeT >= 48) {
      Wd.timeT = 0; Wd.time--;
      if (Wd.time === 100 && !Wd.hurry) { Wd.hurry = true; Sound.fx('warn'); Sound.tempo = 1.25; Wd.banner = 'ANDA LOGO, KINHU!'; Wd.bannerT = 100; }
      if (Wd.time <= 0) { Wd.time = 0; killPlayer('time'); }
    }
  }
  // freadas do ônibus
  if (Wd.brake && !Wd.clear) updateBrakes(Wd);
  // câmera
  const cam = Wd.cam;
  if (cam.lock !== null) { cam.x += (cam.lock - cam.x) * 0.1; if (Math.abs(cam.x - cam.lock) < 0.5) cam.x = cam.lock; }
  else if (!p.dead) {
    if (Math.abs(p.vx) > 0.5) p.look = U.lerp(p.look, p.facing * 24, 0.03);
    const target = p.x + p.w / 2 - W / 2 + p.look;
    cam.x += (target - cam.x) * 0.12;
  }
  cam.x = U.clamp(cam.x, 0, Wd.w * TS - W);
  if (cam.shake > 0) cam.shake *= 0.85;
  if (cam.shake < 0.3) cam.shake = 0;
}

function updateBrakes(Wd) {
  const b = Wd.brake;
  b.t--;
  Wd.push = 0;
  if (b.phase === 'idle') {
    Wd.busSpeed = U.lerp(Wd.busSpeed, 1, 0.02);
    if (b.t <= 0) {
      b.kind = ['freada', 'lombada', 'arrancada', 'freada'][b.k++ % 4];
      b.phase = 'warn'; b.t = 80;
      Wd.banner = b.kind === 'freada' ? '! FREADA !' : b.kind === 'lombada' ? '! LOMBADA !' : '! ARRANCADA !'; Wd.bannerT = 80;
      Sound.fx('warn');
    }
  } else if (b.phase === 'warn') {
    if (b.t <= 0) {
      b.phase = 'act'; b.t = b.kind === 'lombada' ? 2 : 45;
      if (b.kind === 'freada') Sound.fx('brake');
      if (b.kind === 'lombada') {
        shake(10); Sound.fx('thud');
        const p = Wd.player;
        if (p.onGround && !p.dead && !Wd.clear) { p.vy = -5; p.onGround = false; p.ride = null; }
        for (const e of Wd.ents) if (e.enemy && e.onGround && !e.dying) { e.vy = -4; e.onGround = false; }
      }
    }
  } else if (b.phase === 'act') {
    if (b.kind === 'freada') { Wd.push = 0.3; Wd.busSpeed = U.lerp(Wd.busSpeed, 0.2, 0.08); shake(2); }
    if (b.kind === 'arrancada') { Wd.push = -0.3; Wd.busSpeed = U.lerp(Wd.busSpeed, 1.8, 0.08); shake(1.5); }
    if (b.t <= 0) { b.phase = 'idle'; b.t = 360 + Math.floor(Math.random() * 180); }
  }
}

/* ---------------- desenho ---------------- */
const flipVCache = new Map();
function flipV(c) {
  let f = flipVCache.get(c);
  if (f) return f;
  const { c: o, x } = U.canvas(c.width, c.height);
  const src = c.getContext('2d').getImageData(0, 0, c.width, c.height);
  const dst = x.createImageData(c.width, c.height);
  for (let y = 0; y < c.height; y++) dst.data.set(src.data.subarray((c.height - 1 - y) * c.width * 4, (c.height - y) * c.width * 4), y * c.width * 4);
  x.putImageData(dst, 0, 0);
  flipVCache.set(c, o);
  return o;
}

function drawTiles(Wd, cx) {
  const T = Wd.T, t = Wd.t;
  const tx0 = Math.max(0, Math.floor(cx / TS)), tx1 = Math.min(Wd.w - 1, Math.floor((cx + W) / TS) + 1);
  const qf = [0, 0, 0, 1, 2, 1][Math.floor(t / 8) % 6];
  // buracos em fases internas ficam escuros (poço do elevador, piso do ônibus)
  if (Wd.def.indoor) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (Wd.map[Wd.h - 1][tx] === '.' && Wd.map[Wd.h - 2][tx] === '.') {
        ctx.fillStyle = '#121219'; ctx.fillRect(tx * TS, (Wd.h - 2) * TS, TS, 2 * TS);
        ctx.fillStyle = '#1e1e2a'; ctx.fillRect(tx * TS, (Wd.h - 2) * TS, TS, 2);
        if (Wd.theme === 'onibus') { ctx.fillStyle = '#d8d8d0'; if ((tx * TS + Math.floor(Wd.busX * 4)) % 64 < 24) ctx.fillRect(tx * TS + ((Math.floor(Wd.busX * 4)) % 16), (Wd.h - 1) * TS + 4, 6, 2); }
      }
    }
  }
  for (let ty = 0; ty < Wd.h; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const ch = Wd.map[ty][tx];
      if (ch === '.' || ch === 'Z') continue;
      let x = tx * TS, y = ty * TS;
      let img = null;
      switch (ch) {
        case '#': case 'I': {
          const up = tileAt(tx, ty - 1), l = tileAt(tx - 1, ty), r = tileAt(tx + 1, ty);
          const m = (GROUNDISH.has(up) ? 0 : 1) | (isSolid(l) ? 0 : 2) | (isSolid(r) ? 0 : 4);
          img = ch === 'I' ? T.wet[m] : T.ground[m][(tx * 7 + ty * 3) % 3];
          break;
        }
        case '_': img = T.road[tx % 2]; break;
        case 'B': img = T.brick; break;
        case '?': case 'H': case 'L': case '!': img = T.q[qf]; break;
        case 'U': img = T.used; break;
        case 'S': img = T.hard[Math.floor(t / 20 + tx) % 2]; break;
        case '=': img = T.plat; break;
        case 'D': img = T.desk; break;
        case 'Y': img = T.seat; break;
        case 'y': img = T.seatBack; break;
        case '|': img = T.pole; break;
        case '-': img = T.rail; break;
        case '^': img = T.spike[Math.floor(t / 6) % 2]; break;
        case '~': img = tileAt(tx, ty - 1) === '~' ? T.liquid[Math.floor(t / 10) % 4] : T.liquidTop[Math.floor(t / 10) % 4]; break;
        case 'T': img = T.prop; break;
        case 'X': img = T.shooter; break;
        case 'c': img = SPR.coin[Math.floor(t / 7) % 4].r; break;
      }
      if (!img) continue;
      for (const b of Wd.bumps) if (b.tx === tx && b.ty === ty) y -= Math.round(Math.sin((b.t / 10) * Math.PI) * 5);
      ctx.drawImage(img, x, y);
    }
  }
}

function personSprite(set, frame) {
  if (frame === 'act') return set.act;
  return set.walk[frame % set.walk.length];
}

function drawEnemy(e) {
  const left = e.dir < 0;
  let spr = null, ox = 0, oy = 0;
  switch (e.type) {
    case 'dog': spr = e.state === 'bark' ? SPR.dogBark : SPR.dog[e.frame]; ox = -2; oy = -3; break;
    case 'pigeon': spr = SPR.pigeon[e.frame]; ox = -1; oy = -4; break;
    case 'roach': spr = SPR.roach[e.frame]; ox = -2; oy = -10; break;
    case 'bug': spr = e.squish ? SPR.bugFlat : SPR.bug[e.frame]; ox = -2; oy = -7; break;
    case 'flybug': spr = SPR.flybug[e.frame]; ox = -2; oy = -4; break;
    case 'skater': spr = SPR.skater.walk[0]; ox = -2; oy = -24 + e.h - 2; break;
    case 'thief': spr = personSprite(SPR.thief, e.frame); break;
    case 'lady': spr = personSprite(SPR.lady, e.frame); break;
    case 'coworker': spr = personSprite(SPR.coworker, e.frame); break;
    case 'intern': spr = personSprite(SPR.intern, e.frame); break;
    case 'worker': spr = personSprite(SPR.worker, e.frame); break;
  }
  if (!spr) return;
  if (['thief', 'lady', 'coworker', 'intern', 'worker'].includes(e.type)) { ox = -2; oy = e.h - 24; }
  if (e.dying && !e.squish && ['thief', 'lady', 'coworker', 'intern', 'worker', 'skater'].includes(e.type)) spr = SPR[e.type].dizzy;
  const img = left ? spr.l : spr.r;
  const dx = Math.round(e.x + ox), dy = Math.round(e.y + oy);
  if (e.dying && !e.squish) ctx.drawImage(flipV(img), dx, dy);
  else ctx.drawImage(img, dx, dy);
  // acessórios
  if (!e.dying) {
    if (e.type === 'skater') drawSpr(SPR.board, e.x - 1, e.y + e.h - 3, left);
    if (e.type === 'intern') drawSpr(SPR.cup, left ? e.x - 3 : e.x + e.w + 1, e.y + 8, left);
    if (e.type === 'lady') {
      const sw = e.swing > 4 && e.swing < 22;
      drawSpr(SPR.bag, sw ? (left ? e.x - 10 : e.x + e.w + 4) : (left ? e.x - 3 : e.x + e.w - 1), sw ? e.y + 6 : e.y + 11, left);
    }
    if (e.type === 'thief' && e.state === 'flee') drawSpr(SPR.coin[0], e.x - 2, e.y - 12, false);
  }
}

function drawWorld() {
  const Wd = World, cam = Wd.cam, p = Wd.player;

  if (Wd.house) ctx.drawImage(OBJ.house, Wd.house.x - 4, Wd.house.y - 64);
  if (Wd.goal) {

    if (k === 'busstop') ctx.drawImage(OBJ.busstop, g.x - 24, g.y - 64);
    if (k === 'busdoor') ctx.drawImage(OBJ.busdoor, g.x - 8, g.y - 64);
    if (k === 'building') ctx.drawImage(OBJ.building, g.x - 8, g.y - 80);

  }
  for (const d of Wd.decor) if (d.x > cx - 40 && d.x < cx + W + 8) ctx.drawImage(d.img, d.x, d.y);

  for (const e of Wd.ents) if (e.kind === 'item' && e.emerge > 0) drawItem(e);
  drawTiles(Wd, cx);
  // plataformas
  for (const pl of Wd.plats) {
    if (!pl.alive || (pl.kind !== 'h' && pl.kind !== 'v' && pl.kind !== 'fall')) continue;
    if (pl.x > cx + W || pl.x + pl.w < cx) continue;
    const img = Wd.theme === 'escritorio' ? OBJ.elevatorPlat : pl.kind === 'fall' ? OBJ.crackPlank : OBJ.plank;
    const shakeX = pl.kind === 'fall' && pl.state === 'shake' ? (pl.t % 4 < 2 ? 1 : -1) : 0;
    ctx.drawImage(img, Math.round(pl.x) + shakeX, Math.round(pl.y));
    if (pl.kind === 'v' && Wd.theme === 'escritorio') { ctx.fillStyle = '#5a606c'; ctx.fillRect(Math.round(pl.x) + 23, 32, 2, Math.round(pl.y) - 32); }
  }
  for (const e of Wd.ents) {
    if (!e.alive) continue;
    if (e.x > cx + W + 48 || e.x + 64 < cx) continue;
    switch (e.kind) {
      case 'spring': ctx.drawImage(OBJ.mattress[e.t > 0 ? 1 : 0], e.x - 1, e.y - 6); break;
      case 'checkpoint': ctx.drawImage(OBJ.checkpoint[e.on ? 1 : 0], e.x, e.y); break;
      case 'crusher': {
        const top = 32;
        ctx.fillStyle = '#5a606c';
        for (let y = top; y < e.y; y += 4) ctx.fillRect(e.x + 14, y, 3, 2);
        ctx.drawImage(OBJ.weight, Math.round(e.x - 1), Math.round(e.y - 2));
        break;
      }
      case 'car': {
        const c = OBJ.cars[e.color];
        ctx.globalAlpha = U.clamp(e.alpha, 0, 1);
        ctx.drawImage(c.r, Math.round(e.x), Math.round(e.y));
        ctx.globalAlpha = 1;
        break;
      }
      case 'popcoin': ctx.drawImage(SPR.coin[Math.floor(e.t / 3) % 4].r, Math.round(e.x), Math.round(e.y)); break;
      case 'coin': if (e.t < 340 || e.t % 6 < 3) ctx.drawImage(SPR.coin[Math.floor(e.t / 4) % 4].r, Math.round(e.x - 3), Math.round(e.y - 3)); break;
      case 'item': if (e.emerge <= 0) drawItem(e); break;
      case 'boss': drawBoss(e); break;
      default: if (e.enemy) drawEnemy(e);
    }
  }
  drawPlayer(p);
  if (Wd.clear && Wd.clear.bus) ctx.drawImage(OBJ.bus, Math.round(Wd.clear.bus.x), Math.round(Wd.clear.bus.y));
  // projéteis
  for (const b of Wd.projs) {
    const bx = Math.round(b.x), by = Math.round(b.y);
    switch (b.type) {
      case 'bean': ctx.drawImage(SPR.bean[Math.floor(b.t / 4) % 2].r, bx - 1, by - 1); break;
      case 'poop': ctx.drawImage(SPR.poop.r, bx - 1, by - 1); break;
      case 'plane': ctx.drawImage(b.dir < 0 ? SPR.plane.l : SPR.plane.r, bx - 1, by - 1); break;
      case 'paper': ctx.drawImage(SPR.paper.r, bx - 1, by - 1); break;
      case 'water': ctx.drawImage(SPR.water.r, bx, by); break;
      case 'zap': ctx.drawImage(SPR.spark[Math.floor(b.t / 3) % 2].r, bx + 1, by); break;
      case 'glitch': ctx.drawImage(SPR.glitch[Math.floor(b.t / 3) % 3].r, bx, by); break;
      case 'wave':
        ctx.fillStyle = '#c8f0a0'; ctx.fillRect(bx + 1, by + 4, 8, 6);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(bx + 3 + (b.t % 4 < 2 ? 1 : 0), by + 2, 4, 3);
        break;
    }
  }
  // partículas
  for (const q of Wd.parts) {
    if (q.kind === 'text') {
      if (q.t < q.life - 10 || q.t % 2) Font.draw(q.text, q.x, q.y, q.color);
      continue;
    }
    ctx.globalAlpha = q.kind === 'dust' ? Math.max(0, 1 - q.t / q.life) : 1;
    ctx.fillStyle = q.color;
    const s = q.size;
    ctx.fillRect(Math.round(q.x - s / 2), Math.round(q.y - s / 2), s, s);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawItem(e) {
  const spr = { hotdog: SPR.hotdog, coffee: SPR.coffee, claws: SPR.claws, badge: SPR.badge, trophy: SPR.trophy }[e.item];
  const bob = e.item === 'coffee' && e.emerge <= 0 ? Math.round(Math.sin(e.t * 0.1)) : 0;
  ctx.drawImage(e.dir < 0 ? spr.l : spr.r, Math.round(e.x - 2), Math.round(e.y - 4 + bob));
}

function drawBoss(b) {
  if (b.inv > 0 && b.state !== 'dead' && Math.floor(b.t / 3) % 2) return;
  const S = SPR.boss;
  let spr = S.idle;
  if (b.state === 'spit' && b.t > 14) spr = S.open;
  if (b.state === 'jump' && !b.onGround) spr = S.jump;
  if (b.state === 'hurt' || (b.state === 'dead' && b.t % 8 < 4)) spr = S.hurt;
  const bob = b.state === 'walk' ? Math.round(Math.sin(b.t * 0.2)) : 0;
  const crouch = b.state === 'jump' && b.t < 18 ? 2 : 0;
  ctx.drawImage(b.dir < 0 ? spr.l : spr.r, Math.round(b.x - 6), Math.round(b.y - 10 + bob + crouch));
}

function drawPlayer(p) {
  if (p.hidden) return;
  if (p.inv > 0 && !p.dead && Math.floor(p.inv / 3) % 2) return;
  let set = Game.power === 1 ? SPR.kinhuCafe : SPR.kinhu;
  if (p.wild > 0 && (p.wild > 120 || Math.floor(p.wild / 4) % 2)) set = SPR.kinhuWild[Math.floor(World.t / 3) % 3];
  let s = set.idle;
  if (p.dead) s = set.hurt;
  else if (p.win) s = set.win;
  else if (!p.onGround && !p.ride) s = p.vy < 0 ? set.jump : set.fall;
  else if (p.skid) s = set.skid;
  else if (Math.abs(p.vx) > 0.2) s = set.run[Math.floor(p.anim) % 4];
  else if (p.blink < 8) s = set.blink;
  ctx.drawImage(p.facing < 0 ? s.l : s.r, Math.round(p.x - 4), Math.round(p.y - 3));
}

  /* ---------- DOM: arquivo, toque, botões ---------- */
  setupDom() {
    if (typeof __NODE_TEST__ !== 'undefined') return;
    const file = document.getElementById('loadFile');
    file.addEventListener('change', () => { if (file.files[0]) this.readFile(file.files[0]); file.value = ''; });
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) this.readFile(f); });
    const unlock = () => Sound.unlock();
    ['keydown', 'pointerdown', 'touchstart'].forEach(ev => window.addEventListener(ev, unlock, { passive: true }));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (this.state === 'play') this.openPause(); if (Sound.ctx) Sound.ctx.suspend(); }
      else if (Sound.ctx) Sound.ctx.resume();
    });
    const btn = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', e => { e.preventDefault(); fn(); el.blur(); }); };
    btn('btnSave', () => this.exportSave());
    btn('btnLoad', () => this.openFile());
    btn('btnFull', () => this.toggleFull());
    btn('btnMute', () => this.toggleMute());
    // controles de toque
    const touchy = 'ontouchstart' in window || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    if (touchy) document.body.classList.add('touch');
    document.querySelectorAll('[data-act]').forEach(el => {
      const acts = el.dataset.act.split(',');
      const set = v => { for (const a of acts) Input.touch[a] = v; if (v) for (const a of acts) Input.hits['touch-' + a] = true; };
      el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture && el.setPointerCapture(e.pointerId); set(true); el.classList.add('on'); });
      const off = e => { e.preventDefault(); set(false); el.classList.remove('on'); };
      el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
    });
    // tocar na tela do título/história também avança
    cv.addEventListener('pointerdown', () => { if (this.state !== 'play') Input.hits['touch-confirm'] = true; });
    // toques valem como "apertou" também
    for (const a of ['jump', 'run', 'start', 'confirm', 'left', 'right', 'up', 'down', 'back']) Input.map[a].push('touch-' + a);
    window.addEventListener('keydown', () => { if (!touchy) return; document.body.classList.remove('touch'); fitScreen(); }, { once: true });
  },
  openFile() { const f = document.getElementById('loadFile'); if (f) f.click(); },
  readFile(file) {
    const rd = new FileReader();
    rd.onload = () => {
      const r = Save.importText(String(rd.result));
      this.toast(r.msg);
      if (!r.ok) { Sound.fx('hurt'); return; }
      Sound.fx('check');
      Game.hiscore = Save.data.hiscore; Game.unlocked = Save.data.unlocked;
      if (Save.data.run && (this.state === 'play' || this.state === 'pause' || this.state === 'gameover')) this.continueRun();
      else if (this.state === 'title' || this.state === 'select') { this.openTitleMenu(); }
    };
    rd.readAsText(file);
  },
  exportSave() {
    if (this.state === 'play' || this.state === 'pause') this.saveProgress(false, true);
    const ok = Save.exportFile();
    this.toast(ok ? 'ARQUIVO DE SAVE BAIXADO!' : 'NÃO FOI POSSÍVEL SALVAR');
  },
  toggleFull() {
    const el = document.documentElement;
    try {
      if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } catch (e) { /* sem tela cheia */ }
  },
  toggleMute() {
    Sound.setMuted(!Sound.muted);
    this.toast(Sound.muted ? 'SOM DESLIGADO' : 'SOM LIGADO');
    try { localStorage.setItem('kinhus-adventure:mute', Sound.muted ? '1' : '0'); } catch (e) { /* ok */ }
  },
  toast(msg) { this.toastMsg = msg; this.toastT = 150; },

  /* ---------- progresso ---------- */
  saveProgress(cleared, quiet) {
    let level = Game.levelIdx, checkpoint = Game.checkpoint;
    if (cleared) { level++; checkpoint = false; }
    Game.hiscore = Math.max(Game.hiscore, Game.score);
    const d = Save.data;
    d.hiscore = Game.hiscore;
    if (level >= LEVELS.length) { d.completed = true; d.run = null; }
    else {
      d.run = { level, lives: Game.lives, score: Game.score, coins: Game.coins, hearts: cleared ? Game.maxHearts : Math.max(1, Game.hearts), power: Game.power, checkpoint, savedAt: Date.now() };
      d.unlocked = Math.max(d.unlocked, level + 1);
    }
    Game.unlocked = d.unlocked;
    Save.persist();
    if (!quiet) this.saveIcon = 90;
  },
  continueRun() {
    const r = Save.data.run;
    if (!r) return;
    Game.levelIdx = r.level; Game.lives = r.lives; Game.score = r.score; Game.coins = r.coins;
    Game.hearts = r.hearts; Game.power = r.power; Game.checkpoint = r.checkpoint;
    this.go('intro');
  },
  newGame() {
    Game.reset();
    if (Game.cheatLives) Game.lives = 9;
    Save.data.plays++;
    Save.persist();
    this.go('story');
  },
  startLevel(idx) {
    Game.levelIdx = idx; Game.checkpoint = false;
    Game.lives = Math.max(Game.lives, Game.cheatLives ? 9 : 3);
    this.go('intro');
  },

  /* ---------- transições ---------- */
  go(state, fn, instant) {
    const apply = () => { this.state = state; this.t = 0; this.menu = null; if (fn) fn(); this.enter(state); };
    if (instant) { apply(); return; }
    this.trans = { t: 0, dur: 18, apply, done: false };
  },
  enter(state) {
    Input.clear();
    switch (state) {
      case 'title': Sound.play('title'); break;
      case 'story': Sound.play('title'); this.storyT = 0; break;
      case 'intro': Sound.stop(); break;
      case 'play':
        loadLevel(Game.levelIdx, Game.checkpoint);
        Game.hearts = Math.max(1, Game.hearts);
        Sound.tempo = 1;
        Sound.play(World.th.music, true);
        this.saveProgress(false, true);
        break;
      case 'gameover':
        Sound.play('gameover', true);
        Game.hiscore = Math.max(Game.hiscore, Game.score);
        Save.data.hiscore = Game.hiscore; Save.persist();
        this.menu = this.makeMenu([
          { label: 'TENTAR DE NOVO (FASE ' + (Game.levelIdx + 1) + ')', fn: () => { Game.lives = 3; Game.score = 0; Game.coins = 0; Game.hearts = 3; Game.power = 0; Game.checkpoint = false; this.go('intro'); } },
          { label: 'MENU INICIAL', fn: () => this.go('title') },
        ]);
        break;
      case 'ending': Sound.play('ending', true); break;
    }
  },

  /* ---------- menus ---------- */
  makeMenu(items, opt = {}) { return { items, i: opt.i || 0, title: opt.title, back: opt.back }; },
  openTitleMenu() {
    const d = Save.data, items = [];
    if (d.run) items.push({ label: 'CONTINUAR - FASE ' + (d.run.level + 1) + (d.run.checkpoint ? ' (PONTO)' : ''), fn: () => this.continueRun() });
    items.push({ label: 'NOVO JOGO', fn: () => this.newGame() });
    if (d.unlocked > 1 || d.completed) items.push({ label: 'ESCOLHER FASE', fn: () => this.openSelect() });
    items.push({ label: 'CARREGAR ARQUIVO DE SAVE', fn: () => this.openFile() });
    if (d.run || d.unlocked > 1 || d.completed) items.push({ label: 'BAIXAR ARQUIVO DE SAVE', fn: () => this.exportSave() });
    items.push({ label: 'COMO JOGAR', fn: () => { this.sub = 'help'; } });
    this.menu = this.makeMenu(items, { back: () => { this.menu = null; } });
  },
  openSelect() {
    const max = Save.data.completed ? LEVELS.length : Save.data.unlocked;
    const items = LEVELS.slice(0, max).map((L, i) => ({ label: (i + 1) + '. ' + L.name, fn: () => { Game.reset(); this.startLevel(i); } }));
    this.menu = this.makeMenu(items, { title: 'ESCOLHER FASE', back: () => this.openTitleMenu() });
  },
  openPause() {
    this.state = 'pause'; Sound.fx('pause');
    if (Sound.ctx && Sound.song) Sound.song.out.gain.setTargetAtTime(0.25, Sound.ctx.currentTime, 0.05);
    this.menu = this.makeMenu([
      { label: 'CONTINUAR', fn: () => this.closePause() },
      { label: 'BAIXAR ARQUIVO DE SAVE', fn: () => this.exportSave() },
      { label: 'CARREGAR ARQUIVO DE SAVE', fn: () => this.openFile() },
      { label: () => 'SOM: ' + (Sound.muted ? 'DESLIGADO' : 'LIGADO'), fn: () => this.toggleMute() },
      { label: 'REINICIAR FASE', fn: () => { Game.hearts = Game.maxHearts; this.go('play'); } },
      { label: 'SAIR PARA O MENU', fn: () => { this.saveProgress(false, true); this.go('title'); } },
    ], { title: 'PAUSA', back: () => this.closePause() });
  },
  closePause() {
    this.state = 'play'; this.menu = null; Input.clear();
    if (Sound.ctx && Sound.song) Sound.song.out.gain.setTargetAtTime(1, Sound.ctx.currentTime, 0.05);
  },
  updateMenu() {
    const m = this.menu;
    if (!m) return;
    if (Input.pressed('up')) { m.i = (m.i + m.items.length - 1) % m.items.length; Sound.fx('cursor'); }
    if (Input.pressed('down')) { m.i = (m.i + 1) % m.items.length; Sound.fx('cursor'); }
    if (Input.pressed('confirm')) { Sound.fx('select'); m.items[m.i].fn(); return; }
    if (Input.pressed('back') && m.back) { Sound.fx('cursor'); m.back(); }
  },
  drawMenu(m, cx, y, opt = {}) {
    const lines = m.items.map(it => (typeof it.label === 'function' ? it.label() : it.label));
    const w = Math.max(...lines.map(l => Font.width(l)), m.title ? Font.width(m.title) : 0) + 28;
    const h = lines.length * 12 + (m.title ? 18 : 6) + 6;
    const x = Math.round(cx - w / 2);
    ctx.fillStyle = opt.bg || '#00153b'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#ffbf30'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
    ctx.fillStyle = '#ff8130'; ctx.fillRect(x + 1, y + 1, w - 2, 1);
    let yy = y + 6;
    if (m.title) { Font.draw(m.title, cx, yy, '#ffbf30', { align: 'center' }); yy += 16; }
    lines.forEach((l, i) => {
      const sel = i === m.i;
      if (sel) Font.draw('►', x + 7 + (Math.floor(this.t / 8) % 2), yy, '#ffbf30');
      Font.draw(l, x + 16, yy, sel ? '#ffe384' : '#e9effb');
      yy += 12;
    });
  },

  /* ---------- atualização ---------- */
  update() {
    Input.update();
    this.t++;
    if (this.toastT > 0) this.toastT--;
    if (this.saveIcon > 0) this.saveIcon--;
    if (Input.pressed('mute')) this.toggleMute();
    if (Input.pressed('full')) this.toggleFull();
    if (this.trans) {
      const tr = this.trans;
      tr.t++;
      if (tr.t === tr.dur && !tr.done) { tr.done = true; tr.apply(); }
      if (tr.t >= tr.dur * 2) this.trans = null;
      if (tr.t < tr.dur) return;
    }
    switch (this.state) {
      case 'title':
        this.checkCheat();
        if (this.sub === 'help') { if (Input.pressed('confirm') || Input.pressed('back') || Input.pressed('start')) { this.sub = null; Sound.fx('cursor'); } break; }
        if (this.menu) this.updateMenu();
        else if (Input.pressed('start') || Input.pressed('confirm') || Input.pressed('jump')) { Sound.unlock(); Sound.fx('select'); this.openTitleMenu(); }
        break;
      case 'story':
        this.storyT++;
        if ((Input.pressed('start') || Input.pressed('confirm')) && this.storyT > 20) {
          const total = STORY.join('').length;
          if (this.storyT * 0.7 < total + 10) this.storyT = Math.ceil((total + 10) / 0.7);
          else { Game.levelIdx = 0; this.go('intro'); }
        }
        break;
      case 'intro':
        if (this.t > 170 || (this.t > 30 && (Input.pressed('start') || Input.pressed('confirm')))) this.go('play');
        break;
      case 'play':
        if (Input.pressed('start') && !World.clear && !World.player.dead) { this.openPause(); break; }
        updateWorld();
        break;
      case 'pause': this.updateMenu(); break;
      case 'gameover': if (this.t > 60) this.updateMenu(); break;
      case 'ending':
        if (this.t > 600 && (Input.pressed('start') || Input.pressed('confirm'))) this.go('title');
        break;
    }
  },
  // código secreto na tela de título: ▲▲▼▼◄►◄► X Z
  checkCheat() {
    const seq = ['up', 'up', 'down', 'down', 'left', 'right', 'left', 'right', 'run', 'jump'];
    for (const a of ['up', 'down', 'left', 'right', 'run', 'jump']) {
      if (!Input.pressed(a)) continue;
      if (a === 'jump' && Input.pressed('up')) continue;
      this.cheat = seq[this.cheat | 0] === a ? (this.cheat | 0) + 1 : a === 'up' ? 1 : 0;
      if (this.cheat === seq.length) {
        this.cheat = 0;
        Save.data.unlocked = LEVELS.length; Save.persist(); Game.unlocked = LEVELS.length;
        Game.cheatLives = true;
        Sound.fx('kinhurine'); this.toast('MODO KINHURINE: TODAS AS FASES + 9 VIDAS!');
        this.openTitleMenu();
      }
      break;
    }
  },
  onDeath() {
    if (this.trans) return;
    Game.lives--;
    Game.hearts = Game.maxHearts; Game.power = 0;
    if (Game.lives <= 0) { Game.lives = 0; Save.data.run = null; Save.persist(); this.go('gameover'); }
    else { this.saveProgress(false, true); this.go('intro'); }
  },
  levelDone() {
    if (this.trans) return;
    Game.levelIdx++;
    Game.checkpoint = false;
    Game.hearts = Game.maxHearts;
    if (Game.levelIdx >= LEVELS.length) { this.go('ending'); return; }
    this.go('intro');
  },
  bossClear() {
    World.clear = { phase: 'tally', t: 0, kind: 'trophy' };
    World.player.control = false; World.player.win = true;
    Sound.stop(); Sound.play('clear');
    Game.completed = true;
    this.saveProgress(true);
  },

  /* ---------- desenho ---------- */
  render() {
    switch (this.state) {
      case 'title': this.drawTitle(); break;
      case 'story': this.drawStory(); break;
      case 'intro': this.drawIntro(); break;
      case 'play': case 'pause': drawWorld(); this.drawHUD(); if (this.state === 'pause') { ctx.fillStyle = 'rgba(0,10,30,0.55)'; ctx.fillRect(0, 0, W, H); this.drawMenu(this.menu, W / 2, 62); } break;
      case 'gameover': this.drawGameOver(); break;
      case 'ending': this.drawEnding(); break;
    }
    if (this.toastT > 0 && this.toastMsg) {
      const w = Font.width(this.toastMsg) + 12;
      ctx.fillStyle = 'rgba(0,21,59,0.9)'; ctx.fillRect(W / 2 - w / 2, H - 22, w, 14);
      Font.draw(this.toastMsg, W / 2, H - 18, '#ffe384', { align: 'center' });
    }
    if (this.trans) this.applyTrans();
  },
  applyTrans() {
    const tr = this.trans, k = tr.t < tr.dur ? tr.t / tr.dur : 2 - tr.t / tr.dur;
    const m = 1 + Math.floor(k * 10);
    if (m > 1) {
      // efeito mosaico (marca registrada do SNES)
      if (!this.mos) this.mos = U.canvas(W, H);
      const sw = Math.ceil(W / m), sh = Math.ceil(H / m);
      this.mos.x.drawImage(cv, 0, 0, W, H, 0, 0, sw, sh);
      ctx.drawImage(this.mos.c, 0, 0, sw, sh, 0, 0, sw * m, sh * m);
    }
    ctx.fillStyle = 'rgba(0,0,0,' + U.clamp(k * 1.1, 0, 1).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  },
  drawTitle() {
    const img = this.titleImg;
    if (img && (img.complete || img.data) && img.width) {
      ctx.drawImage(img, 0, 0);
      ctx.drawImage(img, 0, 195, 256, 1, 0, 196, 256, 28);
    } else { ctx.fillStyle = '#a2c4ff'; ctx.fillRect(0, 0, W, H); Font.draw("KINHU'S ADVENTURE", W / 2, 80, '#ffbf30', { align: 'center', scale: 2, outline: true }); }
    if (this.sub === 'help') { this.drawHelp(); return; }
    if (!this.menu) {
      if (Math.floor(this.t / 30) % 2 === 0) { ctx.fillStyle = '#ffffff'; ctx.fillRect(101, 130, 60, 1); ctx.fillRect(101, 150, 60, 1); ctx.fillRect(101, 130, 1, 21); ctx.fillRect(160, 130, 1, 21); }
      const touch = typeof document !== 'undefined' && document.body && document.body.classList.contains('touch');
      if (Math.floor(this.t / 30) % 2 === 0) Font.draw(touch ? 'TOQUE PARA COMEÇAR' : 'APERTE ENTER OU ESPAÇO', W / 2, 205, '#ffffff', { align: 'center', outline: true });
      if (Game.hiscore > 0) Font.draw('RECORDE ' + String(Game.hiscore).padStart(7, '0'), W / 2, 215, '#ffe384', { align: 'center' });
    } else this.drawMenu(this.menu, W / 2, 118);
  },
  drawHelp() {
    ctx.fillStyle = 'rgba(0,21,59,0.94)'; ctx.fillRect(12, 20, W - 24, H - 40);
    const L = [
      ['COMO JOGAR', '#ffbf30'], ['', ''],
      ['SETAS / A D: ANDAR', '#e9effb'], ['Z / ESPAÇO / ▲: PULAR', '#e9effb'], ['X / SHIFT: CORRER', '#e9effb'],
      ['X COM CAFÉ: JOGAR GRÃOS', '#e9effb'], ['▼ + PULAR: DESCER PLATAFORMA', '#e9effb'], ['ENTER: PAUSA   M: SOM   F: TELA CHEIA', '#e9effb'], ['', ''],
      ['CACHORRO-QUENTE: +1 CORAÇÃO', '#ffb0a0'], ['CAFÉ: PODER DE ARREMESSO', '#ffd0a0'], ['GARRAS: MODO KINHURINE!', '#ffe384'], ['CRACHÁ: VIDA EXTRA', '#a0ffa0'], ['', ''],
      ['O JOGO SALVA SOZINHO NO NAVEGADOR.', '#a2c4ff'], ['NA PAUSA DÁ PARA BAIXAR O SAVE', '#a2c4ff'], ['E CARREGAR EM OUTRO LUGAR.', '#a2c4ff'],
    ];
    L.forEach(([t, c], i) => { if (t) Font.draw(t.replace('↑', '▲'), W / 2, 28 + i * 10, c, { align: 'center' }); });
  },
  drawStory() {
    BG.draw('bairro', this.storyT * 0.5, this.storyT);
    ctx.fillStyle = 'rgba(0,21,59,0.82)'; ctx.fillRect(14, 30, W - 28, 140);
    let n = Math.floor(this.storyT * 0.7);
    STORY.forEach((line, i) => {
      if (n <= 0) return;
      const s = line.slice(0, n); n -= line.length;
      Font.draw(s, W / 2 - Font.width(line) / 2, 44 + i * 13, i < 2 ? '#ffe384' : '#ffffff');
    });
    const k = SPR.kinhu, frame = k.run[Math.floor(this.storyT / 6) % 4];
    ctx.drawImage(frame.r, W / 2 - 10, 182);
    if (this.storyT * 0.7 > STORY.join('').length && Math.floor(this.t / 20) % 2) Font.draw('APERTE ENTER', W / 2, 212, '#ffffff', { align: 'center' });
  },
  drawIntro() {
    const L = LEVELS[Game.levelIdx];
    ctx.fillStyle = '#00153b'; ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < H; y += 4) { ctx.fillStyle = y % 8 ? '#021a44' : '#00153b'; ctx.fillRect(0, y, W, 2); }
    Font.draw('FASE ' + L.id, W / 2, 46, '#ffbf30', { align: 'center', scale: 2, outline: true });
    Font.draw(L.name, W / 2, 78, '#ffffff', { align: 'center' });
    ctx.drawImage(SPR.clock, W / 2 - 22, 92);
    Font.draw(L.clock, W / 2 - 10, 95, '#a2c4ff');
    Font.draw(L.goal, W / 2, 116, '#ffe384', { align: 'center' });
    const k = SPR.kinhu.idle;
    ctx.drawImage(k.r, W / 2 - 26, 140);
    Font.draw('× ' + Game.lives, W / 2 + 2, 150, '#ffffff');
    if (Game.checkpoint) Font.draw('CONTINUANDO DO PONTO', W / 2, 180, '#80ff80', { align: 'center' });
  },
  drawGameOver() {
    ctx.fillStyle = '#0a0612'; ctx.fillRect(0, 0, W, H);
    Font.draw('FIM DE JOGO', W / 2, 60, '#ff5a40', { align: 'center', scale: 2, outline: true });
    Font.draw('PONTOS ' + String(Game.score).padStart(7, '0'), W / 2, 92, '#ffffff', { align: 'center' });
    Font.draw('RECORDE ' + String(Game.hiscore).padStart(7, '0'), W / 2, 104, '#ffe384', { align: 'center' });
    ctx.drawImage(SPR.kinhu.hurt.r, W / 2 - 10, 116);
    if (this.menu && this.t > 60) this.drawMenu(this.menu, W / 2, 150);
  },
  drawEnding() {
    BG.draw('final', this.t * 0.8, this.t);
    const T = Tiles.get('bairro');
    for (let x = -16; x < W + 16; x += 16) {
      const ox = Math.round(x - ((this.t * 0.8) % 16));
      ctx.drawImage(T.ground[1][((x / 16) | 0) % 3 < 0 ? 0 : ((x / 16) | 0) % 3], ox, 192); ctx.drawImage(T.ground[0][0], ox, 208);
    }
    const k = SPR.kinhu.run[Math.floor(this.t / 7) % 4];
    ctx.drawImage(k.r, 60, 168);
    ctx.fillStyle = 'rgba(20,10,40,0.35)'; ctx.fillRect(0, 0, W, 160);
    const y0 = 170 - this.t * 0.35;
    CREDITS.forEach((line, i) => {
      const y = y0 + i * 12;
      if (y < -10 || y > 160) return;
      const txt = line === '{SCORE}' ? 'PONTUAÇÃO FINAL: ' + String(Game.score).padStart(7, '0') : line;
      Font.draw(txt, W / 2, y, i === 0 || line === 'FIM' ? '#ffe384' : '#ffffff', { align: 'center' });
    });
    if (this.t > 600 && Math.floor(this.t / 20) % 2) Font.draw('APERTE ENTER', W / 2, 212, '#ffffff', { align: 'center', outline: true });
  },
  drawHUD() {
    const Wd = World, p = Wd.player;
    ctx.fillStyle = 'rgba(0,10,30,0.35)'; ctx.fillRect(0, 0, W, 15);
    ctx.drawImage(SPR.kinhuHead, 0, 0, 20, 12, 1, 1, 20, 12);
    Font.draw('×' + Game.lives, 20, 5);
    for (let i = 0; i < Game.maxHearts; i++) ctx.drawImage((i < Game.hearts ? SPR.heart : SPR.heartEmpty).r, 38 + i * 10, 3);
    if (Game.power === 1) ctx.drawImage(SPR.coffee.r, 69, -2);
    ctx.drawImage(SPR.coinSmall, 90, 5);
    Font.draw('×' + String(Game.coins).padStart(2, '0'), 97, 5);
    Font.draw(String(Game.score).padStart(7, '0'), 128, 5);
    ctx.drawImage(SPR.clock, 180, 2);
    Font.draw(String(Math.max(0, Wd.time)).padStart(3, '0'), 191, 5, Wd.hurry && Wd.t % 20 < 10 ? '#ff6040' : '#ffffff');
    Font.draw('F' + Wd.def.id, 233, 5, '#ffe384');
    if (p.wild > 0) { const w = Math.round((p.wild / 600) * 60); ctx.fillStyle = '#20141c'; ctx.fillRect(W / 2 - 31, 17, 62, 4); ctx.fillStyle = ['#ffe040', '#ff80c0', '#60e0ff'][Math.floor(Wd.t / 4) % 3]; ctx.fillRect(W / 2 - 30, 18, w, 2); }
    if (Wd.bannerT > 0 && (Wd.bannerT > 20 || Wd.bannerT % 4 < 2)) Font.draw(Wd.banner, W / 2, 34, '#ffe384', { align: 'center', outline: true });
    if (Wd.bossFight && Wd.boss && Wd.boss.alive && Wd.boss.state !== 'dead') {
      const b = Wd.boss;
      Font.draw('MEGA BUG', W / 2, 202, '#a0ff80', { align: 'center', outline: true });
      ctx.fillStyle = '#20141c'; ctx.fillRect(W / 2 - 51, 212, 102, 6);
      ctx.fillStyle = '#3a1020'; ctx.fillRect(W / 2 - 50, 213, 100, 4);
      ctx.fillStyle = b.phase === 2 ? '#ff4060' : '#58d048'; ctx.fillRect(W / 2 - 50, 213, Math.round((Math.max(0, b.hp) / b.maxHp) * 100), 4);
    }
    if (this.saveIcon > 0 && this.saveIcon % 10 < 7) Font.draw('SALVO', W - 4, 18, '#80ff80', { align: 'right' });
    // dica de controles no começo do jogo
    if (Wd.def.id === 1 && !Game.checkpoint && Wd.t < 480 && !Wd.clear) {
      const touch = typeof document !== 'undefined' && document.body && document.body.classList.contains('touch');
      const tip = touch ? '◄ ► ANDAR   A: PULAR   B: CORRER' : 'SETAS: ANDAR   Z: PULAR   X: CORRER';
      const w = Font.width(tip) + 12;
      ctx.fillStyle = 'rgba(0,21,59,0.8)'; ctx.fillRect(W / 2 - w / 2, 200, w, 14);
      Font.draw(tip, W / 2, 204, '#ffe384', { align: 'center' });
    }
  },
};

/* ---------- laço principal (60 quadros por segundo fixos) ---------- */
(function boot() {
  try { if (localStorage.getItem('kinhus-adventure:mute') === '1') Sound.muted = true; } catch (e) { /* ok */ }
  App.init();
  if (typeof __NODE_TEST__ !== 'undefined') return;
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(250, now - last); last = now;
    let n = 0;
    while (acc >= STEP && n < 5) { App.update(); acc -= STEP; n++; }
    if (n === 5) acc = 0;
    App.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
